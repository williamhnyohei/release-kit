name: CI

on:
  pull_request:
  push:
    branches: [{{DEFAULT_BRANCH}}]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Checks
        run: |
          if npm run | grep -qE '^  ci'; then
            npm run ci
          elif npm run | grep -qE '^  test'; then
            npm test
          else
            echo "No ci/test script — add one or edit this workflow."
          fi
