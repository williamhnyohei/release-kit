name: Label PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: {{KIT_REPO}}/.github/workflows/reusable-label-pr.yml@{{KIT_REF}}
    secrets:
      RELEASE_KIT_AI_KEY: ${{ secrets.RELEASE_KIT_AI_KEY }}
    with:
      kit_ref: {{KIT_REF}}
      force: false
